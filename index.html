<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hisaab</title>
<meta name="description" content="Hisaab (हिसाब): calculator, land converter and unit tools for Nepal. Works offline.">
<link rel="icon" href="icon.png">
<style>
  :root { --bg:#F8F5EF; --card:#FFFEFA; --ink:#38352F; --muted:#6B655B; --head:#303D32; --accent:#AF5D3F; --line:#D8C8B2; }
  @media (prefers-color-scheme: dark) { :root { --bg:#1E201B; --card:#2C3028; --ink:#EFE8DC; --muted:#C9C0B0; --head:#F8F5EF; --accent:#E0967A; --line:#4A4D43; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Devanagari",sans-serif; }
  main { max-width:560px; margin:0 auto; padding:48px 16px 64px; text-align:center; }
  img { width:120px; height:120px; border-radius:27px; }
  h1 { color:var(--head); font-family:Georgia,"Times New Roman",serif; font-size:2.2rem; margin:16px 0 0; }
  .ne { color:var(--accent); font-size:1.6rem; font-weight:700; margin:0; }
  p { color:var(--muted); }
  .links { display:flex; gap:12px; justify-content:center; flex-wrap:wrap; margin-top:24px; }
  .links a { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:12px 20px; color:var(--accent); text-decoration:none; font-weight:600; }
  footer { margin-top:40px; font-size:.9rem; color:var(--muted); }
</style>
</head>
<body>
<main>
  <img src="icon.png" alt="Hisaab app icon">
  <h1>Hisaab</h1>
  <p class="ne" lang="ne">हिसाब</p>
  <p>Calculator, Ropani/Bigha land converter with price and balance, BS/AD dates, and unit and money tools for Nepal. Works offline, with no account, ads or tracking.</p>
  <div class="links">
    <a href="privacy.html">Privacy policy</a>
    <a href="support.html">Support</a>
  </div>
  <footer>Designed &amp; published by Pralab Dahal · <a href="mailto:hisabnepalapp@gmail.com">hisabnepalapp@gmail.com</a></footer>
</main>
</body>
</html>
